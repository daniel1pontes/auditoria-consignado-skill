[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "auditoria-consignado"
version = "0.1.0"
description = "Apoio à revisão de operações de crédito consignado"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "openpyxl>=3.1,<4", "Pillow>=10,<13", "reportlab>=4,<5"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
auditoria-consignado = "core.cli:main"
[tool.setuptools.packages.find]
include = ["core*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
